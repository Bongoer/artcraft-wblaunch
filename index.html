<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#151619">
<title>ArtCraft Web Launcher</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#151619;color:#fff;font-family:Inter,system-ui,sans-serif}
  iframe{display:block;width:100%;height:100%;border:0;background:#151619}
  a.apps{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(15px,env(safe-area-inset-bottom));z-index:3;padding:13px 17px;background:#eeeeee;color:#171717;text-decoration:none;font-size:13px;font-weight:650;border:1px solid #fff;border-radius:8px;box-shadow:0 3px 18px #0008}
  a.apps:focus-visible{outline:3px solid #80c6ff;outline-offset:3px}
</style>
</head>
<body>
<iframe src="./launcher/" title="Original ArtCraft Launcher (WebAssembly)" allow="clipboard-read; clipboard-write"></iframe>
<a class="apps" href="./apps/">Open web apps ↗</a>
</body>
</html>
